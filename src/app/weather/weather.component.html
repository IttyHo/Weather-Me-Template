<div class="weather-container">
  <mat-card class="search-card">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>חפש עיר</mat-label>
      <input matInput
             type="text"
             [matAutocomplete]="auto"
             (input)="searchLocation($event.target.value)">
      <mat-autocomplete #auto="matAutocomplete">
        <mat-option *ngFor="let result of searchResults"
                   [value]="result.name"
                   (click)="getWeatherForCity(result.name)">
          {{result.name}}
        </mat-option>
      </mat-autocomplete>
    </mat-form-field>
  </mat-card>

  <div class="weather-content" *ngIf="currentWeather">
    <!-- תצוגת מזג אוויר נוכחי -->
    <mat-card class="current-weather">
      <mat-card-header>
        <mat-card-title>{{currentWeather.city}}</mat-card-title>
        <button mat-icon-button (click)="toggleFavorite(currentWeather.city)">
          <mat-icon>{{isFavorite(currentWeather.city) ? 'favorite' : 'favorite_border'}}</mat-icon>
        </button>
      </mat-card-header>
      <mat-card-content>
        <div class="temperature">{{currentWeather.temperature}}°C</div>
        <div class="description">{{currentWeather.description}}</div>
      </mat-card-content>
    </mat-card>

    <!-- תחזית ל-5 ימים -->
    <div class="forecast-container">
      <mat-card *ngFor="let day of forecast" class="forecast-card">
        <mat-card-content>
          <div class="date">{{day.date | date}}</div>
          <div class="temperature">{{day.temperature}}°C</div>
          <div class="description">{{day.description}}</div>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
</div>
