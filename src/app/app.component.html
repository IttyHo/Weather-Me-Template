<div id="app-wrapper">
  <div id="loader">
    <mat-progress-bar *ngIf="displayLoading" mode="indeterminate">
    </mat-progress-bar>
  </div>

  <div id="sidenav-container">
    <h1>WeatherMe</h1>
    
 <app-theme-toggle>
    </app-theme-toggle>

    <mat-slide-toggle id="slide-toggle" (click)="changeTemperatureUnit()">
      <label>
        Temperature in Fahrenheit
      </label>
    </mat-slide-toggle>
  </div>

  <div class="content-wrapper">
    <router-outlet></router-outlet>
  </div>
</div>
